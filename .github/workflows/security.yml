name: Security Checks

# Runs the same security tooling as the app's Code Scan feature, but in CI:
#   - gitleaks           : hardcoded secrets / credentials
#   - semgrep            : static analysis (SAST)
#   - OWASP dependency-check : vulnerable dependencies (SCA, NVD-backed)
#
# Results are uploaded to the repo's Security > Code scanning tab (SARIF) and
# as downloadable artifacts. (Code review by Greptile is handled separately by
# its GitHub app on pull requests.)

on:
  push:
    branches: [main, master, improvements]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run so the dependency scan picks up newly disclosed CVEs.
    - cron: "0 3 * * 1"

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so committed secrets are caught

      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            --exit-code 1 \
            --no-banner
        # Secrets in source are treated as blocking. Set --exit-code 0 above if
        # you'd rather report without failing the build.

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # Static analysis (SAST)
  # ---------------------------------------------------------------------------
  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run semgrep
        # Curated registry rulesets (no telemetry / code upload, unlike `--config auto`).
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --sarif --output semgrep.sarif
        env:
          SEMGREP_SEND_METRICS: "off"
        # Non-blocking: findings surface in the Security tab. Remove this line to
        # make semgrep findings fail the build.
        continue-on-error: true

      - name: Upload semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # Dependency vulnerabilities (SCA)
  # ---------------------------------------------------------------------------
  dependency-check:
    name: SCA (OWASP dependency-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true   # report-only; tighten with --failOnCVSS once triaged
        with:
          project: scrappy-scanner-app
          path: "."
          format: "ALL"           # HTML + JSON + SARIF
          out: reports
          # This action runs with --noupdate and ships the NVD database inside
          # its image, so no NVD API key is needed here. Keep args to a single
          # token (the action passes `args` as one argument).
          args: --enableExperimental

      - name: Inspect dependency-check output
        id: dc_report
        if: always()
        run: |
          echo "Contents of reports/ :"
          ls -la reports 2>/dev/null || echo "  (reports directory was not created)"
          if [ -f reports/dependency-check-report.sarif ]; then
            echo "sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SARIF report was produced by dependency-check; skipping code-scanning upload."
          fi

      - name: Upload dependency-check reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: warn

      - name: Upload dependency-check SARIF
        # Gate on the explicit file check above so a skipped/failed scan (no SARIF)
        # can never fail this job on a missing file.
        if: always() && steps.dc_report.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check
